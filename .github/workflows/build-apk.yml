name: Build Noa APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o APK do zip
        run: |
          ls -la
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo .zip encontrado na raiz do repositório"
            exit 1
          fi
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d noa
          
          # Procura o arquivo .apk dentro da pasta extraída
          FOUND_APK=$(find noa -name "*.apk" | head -n 1)
          
          if [ -z "$FOUND_APK" ]; then
            echo "ERRO: Nenhum arquivo .apk encontrado dentro do zip"
            find noa | head -n 30
            exit 1
          fi
          
          echo "APK encontrado em: $FOUND_APK"
          # Copia o APK para a raiz com o nome desejado
          cp "$FOUND_APK" NoaLauncher.apk

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: NoaLauncher-apk
          path: NoaLauncher.apk
