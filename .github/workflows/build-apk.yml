name: Build Noa APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o código-fonte do zip
        run: |
          ls -la
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo .zip encontrado na raiz do repositório"
            exit 1
          fi
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d noa
          
          # Procura o arquivo settings.gradle.kts (ou build.gradle.kts se não houver settings)
          FOUND=$(find noa -name settings.gradle.kts | head -n 1)
          
          # Se não achar settings, procura o build.gradle.kts da raiz do projeto
          if [ -z "$FOUND" ]; then
             FOUND=$(find noa -name build.gradle.kts | grep -v "/app/" | head -n 1)
          fi

          if [ -z "$FOUND" ]; then
            echo "ERRO: arquivo de build do Gradle não encontrado"
            exit 1
          fi
          
          echo "APP_DIR=$(dirname "$FOUND")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$APP_DIR"
          echo "Pasta do app: $(pwd)"
          ls
          # O --no-daemon ajuda a evitar problemas de memória no GitHub Actions
          gradle assembleDebug --console=plain --no-daemon

      - name: Copiar APK
        run: |
          # Procura o APK gerado em qualquer lugar dentro da pasta do projeto
          APK_PATH=$(find "$APP_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERRO: O APK não foi gerado pela compilação."
            exit 1
          fi
          echo "APK gerado em: $APK_PATH"
          cp "$APK_PATH" NoaLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoaLauncher-apk
          path: NoaLauncher.apk
